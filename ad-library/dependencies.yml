# dependencies.yml: the manifest. SINGLE SOURCE OF TRUTH for the installer.
# SETUP.md, doctor.sh / doctor.ps1, and the SKILL.md onboarding gate are written from this file,
# so a link or verify fixed here must be fixed in all three.

package: ad-library
trust_level: public

path_vars:
  - name: AD_LIBRARY_HOME
    default: "$HOME/ad-library"
    purpose: one folder per brand (state.json, truth ledger, pack cutouts, Library, roadmap, learnings, batch exports)

deps:
  - name: Python packages
    id: pypkgs
    type: python
    required: true
    powers: every local script (Pillow + numpy for QA, cutouts, contact sheets, the print gate)
    install: "python3 -m venv .venv && .venv/bin/pip install -r requirements.txt   # a venv: externally-managed system Pythons refuse a bare pip install"
    get_url: https://pypi.org/project/pillow/
    verify: "python3 -c 'import PIL, numpy'"

  - name: Gemini API key
    id: gemini
    type: env-key
    required: true
    powers: >-
      the photo plates (gen_image.py, ref_sheet.py: Nano Banana 2 / Pro image models) and the
      letter-perfect print gate (print_gate.py, a Gemini vision model) that catches garbled or
      invented print on a generated pack. Plates are the only generated layer in an ad.
    key: GEMINI_API_KEY
    get_url: https://aistudio.google.com/apikey
    tier: "pay as you go on your own Google key: roughly $0.13 per 1K-2K plate, $0.24 per 4K plate; the print gate is a few cents per plate"
    where: ".env -> GEMINI_API_KEY"
    setup_steps: >-
      1) open https://aistudio.google.com/apikey and sign in with a Google account;
      2) click Create API key (enable billing on the project for image generation at volume);
      3) cp .env.example .env (if needed) and fill in its existing GEMINI_API_KEY= line; 4) verify for real: python3 scripts/probe_gemini.py
    verify: "python3 scripts/probe_gemini.py"

  - name: Figma MCP (your own Figma account)
    id: figma_mcp
    type: mcp
    required: true
    powers: >-
      everything in Figma: create_new_file, use_figma (pages, variables, styles, components,
      templates, batch pages), upload_assets (photos into the file), download_assets (2x PNG
      exports), get_screenshot, whoami.
    get_url: https://www.figma.com/signup
    connect: "claude plugin marketplace add anthropics/claude-plugins-official , then claude plugin install figma@claude-plugins-official   # recommended (MCP + its skills). Fallback: claude mcp add --transport http figma https://mcp.figma.com/mcp , then /mcp -> figma -> authenticate. doctor.sh shows it as missing until Claude confirms the tools (bash doctor.sh --figma-confirmed)"
    docs_url: https://help.figma.com/hc/en-us/articles/35281350665623-Figma-MCP-collection-How-to-set-up-the-Figma-remote-MCP-server
    mcp_tool_probe: "mcp__*figma*__use_figma  (the prefix depends on how it was added: plugin or claude mcp add)"
    tier: >-
      a paid plan with a Full or Dev seat. Professional: 200 MCP tool calls a day, 10 a minute
      (Enterprise 600 a day). Starter plans and View/Collab seats get 6 calls a MONTH, not enough.
      Limits: https://developers.figma.com/docs/figma-mcp-server/rate-limits-access/ . Plans: https://www.figma.com/pricing/
    where: "MCP connection (per-user), NOT a .env key"

  - name: curl
    id: curl
    type: cli
    required: true
    powers: posting each image to the upload URL that upload_assets returns
    install: "preinstalled on macOS, most Linux, Windows 10+ (else: apt install curl)"
    get_url: https://curl.se/download.html
    verify: "curl --version"

  - name: OpenCV + SciPy (label repair)
    id: cvrepair
    type: python
    required: false
    powers: >-
      label_composite.py only: replaces a generated pack's garbled label with the real one.
      Optional: skip it if plates never show the pack, or you regenerate instead of repairing.
    install: ".venv/bin/pip install -r requirements-repair.txt"
    get_url: https://pypi.org/project/opencv-python-headless/
    verify: "python3 -c 'import cv2, scipy'"

  - name: Meta Marketing API read token
    id: meta
    type: env-key
    required: false
    powers: >-
      learn.py: pulls every ad with spend (read-only), maps it onto the angle tree, and reads
      launched batch tests. Without it the roadmap starts all-greenfield (learn.py --no-meta)
      and verdicts come from your own reports.
    key: META_ACCESS_TOKEN
    keys: "META_ACCESS_TOKEN, META_AD_ACCOUNT_ID, META_GRAPH_VERSION (optional)"
    get_url: https://developers.facebook.com/tools/explorer/
    connect: >-
      Your OWN token on your own ad account. Quick: Graph API Explorer (link above) -> pick your
      app -> add the ads_read permission -> Generate Access Token (short-lived). Lasting: Meta
      Business Settings -> Users -> System users -> add one, assign your ad account, Generate new
      token with ads_read. Your ad account number is in Ads Manager's account menu (act_<number>).
      Docs: https://developers.facebook.com/docs/marketing-api/get-started/authorization/
    tier: "free"
    where: ".env -> META_ACCESS_TOKEN, META_AD_ACCOUNT_ID"
    verify: "python3 scripts/learn.py <brand>"

  - name: Figma personal access token (comments)
    id: figma_token
    type: env-key
    required: false
    powers: >-
      figma_comments.py: reads and answers reviewer comments on the brand's file. The Figma MCP
      has no comment tools. Without it, ask reviewers to tell you what they commented.
    key: FIGMA_TOKEN
    get_url: https://developers.figma.com/docs/rest-api/authentication/
    connect: "Figma -> Settings -> Security -> Personal access tokens -> Generate new token; scopes: File content read, Comments write; tokens expire (up to 90 days), regenerate when it stops working"
    tier: "free"
    where: ".env -> FIGMA_TOKEN"
    verify: "python3 scripts/figma_comments.py list <brand>"

  - name: The brand's facts and real pack photos
    id: brand_inputs
    type: account-manual
    required: true
    input: true
    powers: the truth ledger (claims, offers, quotes), the pack's printed strings, and the real pack cutouts every ad is built on
    get_url: https://shopify.dev/docs/storefronts/themes/architecture/templates/product
    acquisition: >-
      Produced by the skill during ONBOARD: scripts/crawl_site.py pulls the brand's own site
      photography (Shopify products.json at full resolution, plus the images on the pages you
      list); scripts/cutout.py turns a plain-background product photo into a transparent pack
      cutout (or use Figma's Remove background on a scene photo); scripts/init_brand.py
      scaffolds the truth ledger, pack strings and angle tree, which the session fills in with
      you from the site, the pack and your own offer terms. Only use a site you have the right
      to use images from.
    where: "$AD_LIBRARY_HOME/<brand>/brand/"

  - name: Optional overrides
    id: overrides
    type: env-key
    required: false
    powers: renamed Google model ids and the reply prefix for Figma comments
    key: AD_LIBRARY_VISION_MODEL
    keys: "AD_LIBRARY_VISION_MODEL, AD_LIBRARY_IMAGE_MODEL_PRO, AD_LIBRARY_IMAGE_MODEL_NB2, FIGMA_REPLY_PREFIX"
    get_url: https://ai.google.dev/gemini-api/docs/models
    where: ".env (all optional)"

certify:
  manual: "Not cold-runnable: the deliverable is a Figma file built interactively through the Figma MCP (create_new_file, use_figma, upload_assets, download_assets) on the recipient's own account, which no shell command can drive. Correctness is gated instead by scripts/selftest.py (every offline-testable script; it lists what it does not cover), scripts/probe_gemini.py (a real Gemini call), the Figma check() in every build call, and the batch QA gate in SKILL.md section 5."
