<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../tokens.css">
<style>
  .plate { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .headline { position:relative; font-family:var(--font-slab); font-size:74px; line-height:1.02; color:var(--ink); text-align:center; padding:96px 110px 0; }
  .sub { position:relative; font-family:var(--font-serif); font-style:italic; font-size:29px; color:var(--support); text-align:center; margin-top:18px; padding:0 130px; }
  .cta-pill.small { position:absolute; left:50%; transform:translateX(-50%); bottom:108px; font-size:21px; padding:16px 34px; box-shadow:0 12px 28px color-mix(in srgb, var(--ink) 25%, transparent); }
  .url-line { bottom:44px; color:var(--ink); font-size:21px; }
</style>
</head>
<body>
  <div class="canvas">
    <img class="plate" src="{{img}}">
    <div class="headline">{{headline}}</div>
    <div class="sub">{{sub}}</div>
    <span class="cta-pill small">{{cta}}</span>
    <div class="url-line">{{url}}</div>
  </div>
</body>
</html>
