<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../tokens.css">
<style>
  .headline { font-family:var(--font-serif); font-size:82px; line-height:1.14; color:var(--ink); padding:96px 200px 0 72px; }
  .rule { width:140px; height:6px; background:var(--accent); margin:26px 0 0 72px; }
  .sub { font-family:var(--font-serif); font-size:30px; font-style:italic; color:var(--support); margin-top:32px; padding:0 72px; max-width:640px; line-height:1.5; }
  .product-wrap { position:absolute; right:-30px; bottom:120px; height:620px; transform:rotate(-2deg); }
  .product-wrap img { display:block; height:620px; filter:drop-shadow(0 16px 36px color-mix(in srgb, var(--ink) 14%, transparent)); }
  .cta-pill.fixed { position:absolute; left:72px; bottom:164px; }
  .logo { position:absolute; top:64px; right:72px; width:96px; }
</style>
</head>
<body>
  <div class="canvas">
    <img class="logo" src="{{logo}}">

    <div class="headline">{{headline}}</div>
    <div class="rule"></div>
    <div class="sub">{{sub}}</div>

    <div class="product-wrap"><img src="{{img}}"></div>

    <span class="cta-pill fixed">{{cta}}</span>

    <div class="offer-bar">{{offer}}</div>
  </div>
</body>
</html>
