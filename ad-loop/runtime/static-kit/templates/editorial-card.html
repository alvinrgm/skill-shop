<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../tokens.css">
<style>
  .canvas { background:var(--support); color:var(--ground); }
  .card { position:absolute; top:96px; left:72px; right:72px; background:var(--paper); color:var(--ink); border-radius:14px; padding:56px 60px 200px; box-shadow:0 24px 60px color-mix(in srgb, var(--ink) 30%, transparent); }
  .kicker { font-family:var(--font-serif); font-weight:700; font-size:24px; color:var(--support); letter-spacing:.02em; padding-bottom:22px; border-bottom:2px solid color-mix(in srgb, var(--ink) 12%, transparent); margin-bottom:34px; }
  .headline { font-family:var(--font-serif); font-weight:800; font-size:76px; line-height:1.08; }
  .sub { font-family:var(--font-serif); font-size:29px; line-height:1.5; color:color-mix(in srgb, var(--ink) 75%, transparent); margin-top:30px; max-width:700px; }
  .arrow-wrap { position:absolute; left:50%; transform:translateX(-50%); bottom:150px; color:var(--highlight); }
  .product { position:absolute; right:44px; bottom:130px; height:470px; transform:rotate(2deg); }
  .product img { height:470px; filter:drop-shadow(0 26px 48px color-mix(in srgb, var(--ink) 40%, transparent)); }
  .url-line { color:var(--ground); }
</style>
</head>
<body>
  <div class="canvas">
    <div class="card">
      <div class="kicker">{{kicker}}</div>
      <div class="headline">{{headline}}</div>
      <div class="sub">{{sub}}</div>
    </div>

    <div class="arrow-wrap">
      <svg width="150" height="54" viewBox="0 0 150 54" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M8 14 C 50 34, 95 38, 132 30" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
        <path d="M132 30 L112 38 M132 30 L118 18" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
      </svg>
    </div>

    <div class="product"><img src="{{img}}"></div>

    <div class="url-line">{{url}}</div>
  </div>
</body>
</html>
