<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../tokens.css">
<style>
  .canvas { background:{{field}}; color:{{type_color}}; }
  .headline { font-family:var(--font-slab); font-size:96px; line-height:1.0; text-align:center; padding:110px 90px 0; }
  .sub { font-family:var(--font-serif); font-size:30px; font-style:italic; text-align:center; max-width:720px; margin:22px auto 0; opacity:.92; }
  .product { position:absolute; left:50%; transform:translateX(-50%); bottom:118px; height:700px; display:flex; align-items:flex-end; }
  .product img { height:700px; width:auto; object-fit:contain; filter:drop-shadow(0 34px 60px color-mix(in srgb, var(--ink) 32%, transparent)); }
  .callout.left  { left:64px; top:596px; text-align:right; max-width:230px; }
  .callout.right { right:72px; top:770px; text-align:left; }
  .callout svg { display:block; margin-top:14px; }
  .callout.left svg { margin-left:auto; }
  .stamp { width:200px; height:200px; right:96px; top:420px; color:{{accent}}; font-size:21px; padding:30px; }
</style>
</head>
<body>
  <div class="canvas">
    <div class="headline">{{headline}}</div>
    <div class="sub">{{sub}}</div>

    <div class="product"><img src="{{img}}"></div>

    <div class="callout left">{{callout_left}}
      <svg width="90" height="60" viewBox="0 0 90 60" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M6 8 C 30 14, 58 26, 78 46" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
        <path d="M78 46 L66 42 M78 46 L74 33" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="callout right">{{callout_right}}
      <svg width="90" height="60" viewBox="0 0 90 60" fill="none" xmlns="http://www.w3.org/2000/svg" style="transform:scaleX(-1)">
        <path d="M6 8 C 30 14, 58 26, 78 46" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
        <path d="M78 46 L66 42 M78 46 L74 33" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
      </svg>
    </div>

    <div class="stamp">{{badge}}</div>

    <div class="url-line">{{url}}</div>
  </div>
</body>
</html>
