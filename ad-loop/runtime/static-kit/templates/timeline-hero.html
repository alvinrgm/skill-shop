<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../tokens.css">
<style>
  .canvas { background:{{field}}; color:{{type_color}}; }
  .headline { font-family:var(--font-slab); font-size:96px; line-height:1.0; text-align:center; padding:104px 90px 0; }
  .sub { font-family:var(--font-serif); font-size:29px; font-style:italic; text-align:center; max-width:740px; margin:20px auto 0; opacity:.92; }
  .product { position:absolute; left:50%; transform:translateX(-50%); bottom:300px; height:560px; }
  .product img { height:560px; filter:drop-shadow(0 30px 54px color-mix(in srgb, var(--ink) 32%, transparent)); }
  .timeline { position:absolute; left:72px; right:72px; bottom:132px; height:150px; }
  .tl-line { position:absolute; top:26px; left:40px; right:40px; height:3px; background:currentColor; opacity:.45; }
  .node { position:absolute; top:0; width:280px; text-align:center; }
  .node .dot { width:18px; height:18px; border-radius:50%; background:{{accent}}; margin:18px auto 14px; }
  .node .year { font-family:var(--font-slab); font-size:32px; }
  .node .lbl { font-family:var(--font-serif); font-size:21px; line-height:1.3; margin-top:6px; opacity:.9; }
  .node.n1 { left:0; }
  .node.n2 { left:50%; transform:translateX(-50%); opacity:.5; }
  .node.n2 .dot { background:transparent; border:3px solid currentColor; }
  .node.n2 .year { text-decoration:line-through; text-decoration-thickness:3px; }
  .node.n3 { right:0; }
  .node.n3 .lbl { font-weight:700; opacity:1; }
</style>
</head>
<body>
  <div class="canvas">
    <div class="headline">{{headline}}</div>
    <div class="sub">{{sub}}</div>
    <div class="product"><img src="{{img}}"></div>
    <div class="timeline">
      <div class="tl-line"></div>
      <div class="node n1"><div class="dot"></div><div class="year">{{n1y}}</div><div class="lbl">{{n1l}}</div></div>
      <div class="node n2"><div class="dot"></div><div class="year">{{n2y}}</div><div class="lbl">{{n2l}}</div></div>
      <div class="node n3"><div class="dot"></div><div class="year">{{n3y}}</div><div class="lbl">{{n3l}}</div></div>
    </div>
    <div class="url-line">{{url}}</div>
  </div>
</body>
</html>
