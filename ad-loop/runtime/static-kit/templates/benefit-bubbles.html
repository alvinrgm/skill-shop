<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../tokens.css">
<style>
  .logo { position:absolute; top:64px; left:50%; transform:translateX(-50%); width:96px; }
  .headline { font-family:var(--font-shout); font-size:52px; color:var(--ink); text-align:center; letter-spacing:.05em; padding:190px 150px 0; line-height:1.2; }
  .sub { font-family:var(--font-serif); font-size:28px; font-style:italic; color:var(--support); text-align:center; max-width:760px; margin:14px auto 0; }
  .bullet-stack { position:absolute; left:72px; top:560px; display:flex; flex-direction:column; gap:18px; }
  .bullet { background:var(--paper); border:1.5px solid color-mix(in srgb, var(--ink) 80%, transparent); border-radius:999px; padding:18px 26px; font-family:var(--font-serif); font-weight:bold; font-size:23px; display:flex; align-items:center; gap:14px; width:470px; box-shadow:0 6px 14px color-mix(in srgb, var(--ink) 6%, transparent); }
  .bullet::before { content:''; width:10px; height:10px; border-radius:50%; background:var(--accent); flex-shrink:0; }
  .product-wrap { position:absolute; right:72px; bottom:168px; width:440px; height:640px; display:flex; align-items:flex-end; justify-content:center; }
  .product-wrap img { max-width:100%; max-height:640px; width:auto; height:auto; object-fit:contain; filter:drop-shadow(0 16px 36px color-mix(in srgb, var(--ink) 14%, transparent)); }
</style>
</head>
<body>
  <div class="canvas">
    <img class="logo" src="{{logo}}">

    <div class="headline">{{headline}}</div>
    <div class="sub">{{sub}}</div>

    <div class="bullet-stack">{{bullets}}</div>

    <div class="product-wrap"><img src="{{img}}"></div>

    <div class="offer-bar">
      <span>{{offer}}</span>
      <span class="cta-chip">{{cta}}</span>
    </div>
  </div>
</body>
</html>
