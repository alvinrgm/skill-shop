<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../tokens.css">
<style>
  .plate { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .scrim-band { position:absolute; top:0; left:0; right:0; height:330px; background:linear-gradient(to bottom, color-mix(in srgb, var(--ground) 97%, transparent) 66%, color-mix(in srgb, var(--ground) 0%, transparent)); padding-top:62px; text-align:center; }
  .scrim-band .headline { font-family:var(--font-shout); font-size:50px; color:var(--ink); letter-spacing:.05em; padding:0 150px; }
  .scrim-band .sub { font-family:var(--font-serif); font-style:italic; font-size:28px; color:var(--support); margin-top:16px; }
</style>
</head>
<body>
  <div class="canvas">
    <img class="plate" src="{{img}}">

    <div class="scrim-band">
      <div class="headline">{{headline}}</div>
      <div class="sub">{{sub}}</div>
    </div>

    <div class="offer-bar">
      <span>{{offer}}</span>
      <span class="cta-chip">{{cta}}</span>
    </div>
  </div>
</body>
</html>
