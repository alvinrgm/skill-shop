<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../tokens.css">
<style>
  .plate { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .scrim-card { position:absolute; top:72px; left:72px; right:72px; background:color-mix(in srgb, var(--ground) 97%, transparent); border-radius:24px; padding:54px 44px 48px; text-align:center; box-shadow:0 14px 34px color-mix(in srgb, var(--ink) 16%, transparent); }
  .scrim-card .headline { font-family:var(--font-shout); font-size:72px; line-height:1.1; color:var(--ink); }
  .scrim-card .sub { font-family:var(--font-serif); font-size:29px; color:var(--ink); margin:20px auto 0; max-width:740px; line-height:1.45; }
</style>
</head>
<body>
  <div class="canvas">
    <img class="plate" src="{{img}}">

    <div class="scrim-card">
      <div class="headline">{{headline}}</div>
      <div class="sub">{{sub}}</div>
    </div>

    <div class="offer-bar">
      <span>{{offer}}</span>
      <span class="cta-chip">{{cta}}</span>
    </div>
  </div>
</body>
</html>
