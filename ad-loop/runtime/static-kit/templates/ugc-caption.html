<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../tokens.css">
<style>
  /* UGC caption (elite-corpus pattern). One phone-register photograph, caption
     pills in the brand's own lowercase voice. No invented person, no fabricated
     testimonial — the pills are the brand talking, the way it talks in a video super. */
  .plate { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }

  .pill-c {
    position:absolute; border-radius:28px; padding:22px 28px 24px;
    font-family:var(--font-serif); font-size:30px; line-height:1.34;
    box-shadow:0 14px 30px color-mix(in srgb, var(--ink) 26%, transparent);
  }
  .pill-c .small { display:block; font-size:21px; line-height:1.4; margin-top:10px; opacity:.82; }
  .pill-c::after { content:''; position:absolute; width:26px; height:26px; transform:rotate(45deg); }

  .pill-c.a { left:70px; top:92px; width:472px; background:color-mix(in srgb, var(--paper) 95%, transparent); color:var(--ink); }
  .pill-c.a::after { left:44px; bottom:-9px; background:color-mix(in srgb, var(--paper) 95%, transparent); }

  .pill-c.b { right:70px; top:1032px; width:520px; background:var(--support); color:var(--ground); }
  .pill-c.b::after { right:52px; top:-9px; background:var(--support); }

  .url-line { color:var(--ground); bottom:48px; font-size:22px; text-shadow:0 2px 10px color-mix(in srgb, var(--ink) 60%, transparent); }
</style>
</head>
<body>
  <div class="canvas">
    <img class="plate" src="{{img}}">

    <div class="pill-c a">{{cap_a}}</div>
    <div class="pill-c b">{{cap_b}}<span class="small">{{proof}}</span></div>

    <div class="url-line">{{url}}</div>
  </div>
</body>
</html>
